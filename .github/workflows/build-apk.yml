name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK (MC Mod Studio)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platforms & Build Tools (API 36.1)
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "platforms;android-36.1"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug.keystore is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore."
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fallback debug.keystore matching debugConfig in app/build.gradle.kts..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -alias androiddebugkey -storepass android

      - name: Verify Gradle and environment
        shell: bash
        run: |
          gradle --version
          java -version

      - name: Build Debug APK (:app:assembleDebug)
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --console=plain

      - name: Print detailed build diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Gradle Build Failed ==="
          if [ -f "build/reports/problems/problems-report.html" ]; then
            echo "Problems report generated at build/reports/problems/problems-report.html"
          fi
          find app/build/outputs -maxdepth 4 2>/dev/null || true

      - name: Verify generated APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected Debug APK not found or empty at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-mod-maker-studio-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 30
